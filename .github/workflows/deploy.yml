name: Droplet setup

# Run by hand (Actions > Droplet setup > Run workflow) to prepare a droplet, install pull
# deploys, or apply new settings. It does not deploy code: the droplet does that itself,
# checking every 5 minutes for a newer commit on main whose CI passed (deploy/pull-deploy.sh).
# Needs these repository secrets: DROPLET_HOST, DROPLET_SSH_KEY, POSTGRES_PASSWORD,
# APP_URL, SITE_ADDRESS, ADMIN_EMAILS, and optionally RESEND_API_KEY and EMAIL_FORWARD_TOKEN.
# Feature flags come from repository variables (Settings > Secrets and variables > Actions > Variables),
# e.g. FEATURE_STAYS=on. Change one, then run this workflow to apply it.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  droplet:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      - name: Stop if the droplet isn't configured
        if: env.HOST == ''
        run: |
          echo "::error::DROPLET_HOST is not set. Run deploy/create-droplet.sh first."
          exit 1
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Copy config and install pull deploys
        run: |
          ssh root@"$HOST" 'mkdir -p /opt/concierge/deploy /opt/concierge/backups'
          scp docker-compose.yml root@"$HOST":/opt/concierge/
          scp deploy/Caddyfile deploy/backup.sh deploy/pull-deploy.sh \
            deploy/concierge-deploy.service deploy/concierge-deploy.timer root@"$HOST":/opt/concierge/deploy/
          ssh root@"$HOST" 'sh -s' < deploy/setup-droplet.sh
      - name: Write settings
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FORWARD_TOKEN: ${{ secrets.EMAIL_FORWARD_TOKEN }}
          FEATURE_STAYS: ${{ vars.FEATURE_STAYS }}
        run: |
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "APP_URL=${APP_URL}"
            echo "SITE_ADDRESS=${SITE_ADDRESS:-:80}"
            echo "ADMIN_EMAILS=${ADMIN_EMAILS}"
            echo "RESEND_API_KEY=${RESEND_API_KEY}"
            echo "EMAIL_FORWARD_TOKEN=${EMAIL_FORWARD_TOKEN}"
            echo "EMAIL_FROM=Royal City Concierge <hello@royalcityconcierge.com>"
            echo "FEATURE_STAYS=${FEATURE_STAYS}"
          } > .env.deploy
          scp .env.deploy root@"$HOST":/opt/concierge/.env.new
          rm .env.deploy
          # Keep the live release's APP_IMAGE line; the pull deploy owns it.
          ssh root@"$HOST" 'cd /opt/concierge && { cat .env.new; grep "^APP_IMAGE=" .env 2>/dev/null || true; } > .env.tmp \
            && chmod 600 .env.tmp && mv .env.tmp .env && rm .env.new'
      - name: Apply settings, or deploy main on a fresh droplet
        run: ssh root@"$HOST" 'concierge-deploy --reapply && concierge-deploy --status'
