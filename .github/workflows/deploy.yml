name: Deploy

# Builds the app image, then deploys it to the droplet over SSH.
# Needs these repository secrets: DROPLET_HOST, DROPLET_SSH_KEY, POSTGRES_PASSWORD,
# APP_URL, SITE_ADDRESS, ADMIN_EMAILS, and optionally RESEND_API_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  droplet:
    needs: image
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      - name: Skip until the droplet is configured
        if: env.HOST == ''
        run: echo "::notice::DROPLET_HOST is not set, so the image was built but not deployed."
      - uses: actions/checkout@v4
        if: env.HOST != ''
      - name: Set up SSH
        if: env.HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Prepare the server and copy config
        if: env.HOST != ''
        run: |
          ssh root@"$HOST" 'sh -s' < deploy/setup-droplet.sh
          scp docker-compose.yml root@"$HOST":/opt/concierge/
          scp deploy/Caddyfile deploy/backup.sh root@"$HOST":/opt/concierge/deploy/
      - name: Write settings
        if: env.HOST != ''
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          {
            echo "APP_IMAGE=${IMAGE}:${GITHUB_SHA}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "APP_URL=${APP_URL}"
            echo "SITE_ADDRESS=${SITE_ADDRESS:-:80}"
            echo "ADMIN_EMAILS=${ADMIN_EMAILS}"
            echo "RESEND_API_KEY=${RESEND_API_KEY}"
            echo "EMAIL_FROM=Royal City Concierge <hello@royalcityconcierge.com>"
          } > .env.deploy
          scp .env.deploy root@"$HOST":/opt/concierge/.env
          ssh root@"$HOST" 'chmod 600 /opt/concierge/.env'
          rm .env.deploy
      - name: Start the new version
        if: env.HOST != ''
        run: |
          ssh root@"$HOST" "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && cd /opt/concierge \
            && docker compose pull app \
            && docker compose up -d --no-build --remove-orphans \
            && docker logout ghcr.io \
            && docker image prune -f"
      - name: Check the site responds
        if: env.HOST != ''
        run: |
          for i in $(seq 1 30); do
            if ssh root@"$HOST" 'docker compose -f /opt/concierge/docker-compose.yml exec -T app node -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'; then
              echo "Healthy"; exit 0
            fi
            sleep 5
          done
          ssh root@"$HOST" 'cd /opt/concierge && docker compose logs --tail 50 app'
          exit 1
