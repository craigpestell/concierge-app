name: Database backup

# Nightly dump of the hosted (Neon) database, encrypted and kept as a workflow artifact for
# 14 days. The repository is public, so dumps are always encrypted before upload.
# Needs repository secrets BACKUP_DATABASE_URL (Neon's direct, unpooled URL) and
# BACKUP_PASSPHRASE. Does nothing until BACKUP_DATABASE_URL is set.
# Restore: gpg -d concierge-*.sql.gz.gpg | gunzip | psql "<database url>"
on:
  schedule:
    - cron: "17 10 * * *" # 02:17 / 03:17 Pacific
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Skip until the hosted database is set up
        if: env.DB_URL == ''
        run: echo "::notice::BACKUP_DATABASE_URL is not set, so there's nothing to back up."
      - name: Dump and encrypt
        if: env.DB_URL != ''
        run: |
          test -n "$PASSPHRASE" || { echo "::error::Set BACKUP_PASSPHRASE too."; exit 1; }
          file="concierge-$(date -u +%Y%m%d-%H%M%S).sql.gz.gpg"
          # pg_dump must be at least the server's version; Neon runs Postgres 17.
          docker run --rm -e DB_URL postgres:17-alpine sh -c 'pg_dump --no-owner "$DB_URL"' \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASSPHRASE" -o "$file"
          echo "FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.DB_URL != ''
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error
