# DigitalOcean App Platform spec.
# 1. Create a managed PostgreSQL cluster named "concierge-db" in Toronto (tor1).
# 2. Create the app with: doctl apps create --spec .do/app.yaml
#    (or paste this file into the console under App > Settings > App Spec).
# 3. Set ADMIN_EMAILS and the RESEND_API_KEY secret in the console.
# Migrations run on every start and also add the starting list of services.
name: concierge-app
region: tor
services:
  - name: web
    github:
      repo: craigpestell/concierge-app
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run db:deploy && npm start
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: APP_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: ""
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: "Royal City Concierge <hello@royalcityconcierge.ca>"
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
databases:
  # The existing managed cluster. Attaching it here also adds the app as a trusted source.
  - name: db
    engine: PG
    production: true
    cluster_name: concierge-db
    db_name: defaultdb
    db_user: doadmin
